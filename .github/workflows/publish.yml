name: Publish
on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest
      # npm@latest changes under us; record which one published this release.
      - name: Show toolchain
        run: node --version && npm --version
      - run: npm install
      - run: npm run build
      - name: Publish package
        run: npm publish --access public
      # The version document can exist while the package record installers
      # read never lists it (every release from 0.25.0 on, 2026-09-23). A
      # warning, not a failure: the publish itself succeeded.
      - name: Check the registry lists this version
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          for attempt in $(seq 1 30); do
            if npm view "$name@$version" version --prefer-online >/dev/null 2>&1; then
              echo "listed: $name@$version"
              exit 0
            fi
            sleep 20
          done
          echo "::warning::npm still does not list $name@$version after 10 minutes, so installing by name gets an older version. The publish succeeded; see AGENTS.md, Release Workflow."
