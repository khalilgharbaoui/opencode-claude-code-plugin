# Builds and publishes the docs site to GitHub Pages.
#
# The pages themselves are the repository's own `docs/**.md`, which GitHub renders
# on their own; `site/` is an Astro Starlight project that loads those same files.
#
# Every number on the landing page is read at build time (GitHub REST, api.npmjs.org,
# git, the suite's own summary line) and none of it runs in a visitor's browser, so
# "live" means "rebuilt soon after the thing changed". Four triggers cover that:
#
#   workflow_run       after a successful `Publish`, so a release updates the version
#                      the page shows. A release touches package.json and a tag, and
#                      the tag push is not a branch push, so without this trigger the
#                      site kept the previous version until the next docs commit or
#                      the next cron.
#   push               the paths that feed a number or a page: docs, the site itself,
#                      the README, AGENTS.md, the sources, the test files,
#                      package.json and the bundled skill.
#   schedule           every six hours, for the numbers nothing in this repository
#                      moves (stars, forks, contributors, downloads).
#   workflow_dispatch  by hand.
#
# Every trigger builds the default branch tip, including the post-publish run: the
# version comes from the registry, so the deployed pages should be the newest master
# rather than the released tag's older tree.
#
# Pages setup (once, by hand): Settings > Pages > Source: GitHub Actions.
name: Docs

on:
  push:
    branches: [master]
    paths:
      - 'docs/**'
      - 'site/**'
      - 'README.md'
      - 'AGENTS.md'
      - 'src/**'
      - 'test-*.ts'
      - 'package.json'
      - 'skills/**'
      - '.github/workflows/docs.yml'
  workflow_run:
    workflows: [Publish]
    types: [completed]
  schedule:
    # Every six hours at 23 past. An odd minute avoids the top-of-hour crowd on
    # GitHub's scheduler.
    - cron: '23 */6 * * *'
  workflow_dispatch:

# The build job runs `npm install` (install scripts included) and the whole
# test suite, so it gets read access only. Only the deploy job, which runs no
# repository code, may write to Pages or mint an OIDC token.
permissions:
  contents: read

# One Pages deployment at a time, newest wins: a cron tick that overlaps a release
# rebuild is cancelled rather than queued, so two runs can never deploy out of order.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # A failed or cancelled Publish must not redeploy: it would rebuild for a version
    # npm never received. Every other trigger leaves `workflow_run` unset and passes.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Starlight's lastUpdated reads git history

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # The registry's version document lags the publish itself, by about seven
      # minutes once (AGENTS.md records it), so building the instant Publish finishes
      # would show the version npm served a moment ago: the exact staleness this
      # trigger exists to remove. Only the post-publish run waits; a push or a cron
      # has nothing to wait for and must stay instant. A timeout still builds, with
      # whatever npm reports, and says so in the log.
      - name: Wait for npm to serve this version
        if: github.event_name == 'workflow_run'
        run: |
          want=$(node -p "require('./package.json').version")
          pkg=$(node -p "encodeURIComponent(require('./package.json').name)")
          echo "waiting for ${want} on registry.npmjs.org"
          for attempt in $(seq 1 40); do
            body=$(curl -fsS --max-time 20 "https://registry.npmjs.org/${pkg}/latest" || true)
            got=$(printf '%s' "${body}" | node -e 'let s="";process.stdin.on("data",d=>{s+=d}).on("end",()=>{try{process.stdout.write(String(JSON.parse(s).version??""))}catch{process.stdout.write("")}})')
            if [ "${got}" = "${want}" ]; then
              echo "npm serves ${got} after $(( (attempt - 1) * 15 ))s"
              exit 0
            fi
            echo "attempt ${attempt}: npm says '${got:-unreadable}', want ${want}"
            sleep 15
          done
          echo "::warning::npm did not serve ${want} within 10 minutes; building with whatever the registry reports"

      - name: Install the plugin's dev dependencies
        run: npm install --no-audit --no-fund

      # The count is parsed from the runner's summary, never grepped out of source:
      # tests defined in loops would be missed. A red suite still produces the line,
      # and the build goes on, so a flaky run never blanks the figure.
      - name: Count tests
        run: |
          npm test > /tmp/test.log 2>&1 || echo "suite exit $? (the count is still read)"
          count=$(grep -E '^(ℹ|#) tests [0-9]+' /tmp/test.log | tail -1 | grep -oE '[0-9]+$')
          echo "OCC_STAT_TESTS=${count}" >> "$GITHUB_ENV"
          echo "tests: ${count:-not found}"

      # Counts the entries of `defaultModels`, not the word `defineModel`, which also
      # names the helper's own declaration. `/badges/models.json` republishes this
      # number so the README never has to hard-code it.
      - name: Count registered models
        run: |
          count=$(grep -cE '^\s+"[a-z0-9-]+": defineModel\(' src/models.ts)
          echo "OCC_STAT_MODELS=${count}" >> "$GITHUB_ENV"
          echo "models: ${count}"

      # `npm install`, not `npm ci`: this repository keeps no lockfile (see AGENTS.md),
      # so site/package.json pins exact versions instead.
      - name: Install the docs site
        working-directory: site
        run: npm install --no-audit --no-fund

      - name: Build the docs site
        working-directory: site
        env:
          GITHUB_TOKEN: ${{ github.token }} # raises the REST rate limit; no scopes needed
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
